name: Verify RetailPilot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --no-deps -r backend/requirements.runtime.txt
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: retailpilot
          POSTGRES_USER: retailpilot
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U retailpilot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://retailpilot:ci-only-password@localhost:5432/retailpilot
      JWT_SECRET: ci-only-at-least-32-character-signing-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python scripts/security-scan.py
      - run: pip install -r backend/requirements.lock.txt
      - run: ruff check backend
      - run: python -m pytest backend/tests -q
        env: {PYTHONPATH: backend}
      - run: alembic upgrade head
        working-directory: backend
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend
      - run: node scripts/check-api-proxy.mjs
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          cd ../frontend
          npm run dev -- --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173 && curl -fsS http://127.0.0.1:8000/api/v1/health && break || sleep 2; done
          npm run test:e2e
      - name: Verify managed-account browser lifecycle with isolated identity mock
        run: |
          cd backend
          cd ../frontend
          RETAILPILOT_DEV_API=http://127.0.0.1:8002 npm run dev -- --port 5174 --host 127.0.0.1 > /tmp/accounts-frontend.log 2>&1 &
          # Each scenario gets a fresh provider, database and rate-limit window.
          # Keep production admission/abuse limits intact on fast CI runners.
          for scenario in 'verified account' 'password recovery' 'default-template PKCE' 'Google OAuth redirect'; do
            RETAILPILOT_SAAS_TEST=1 python ../backend/tests/serve_accounts.py > /tmp/accounts-backend.log 2>&1 &
            identity_pid=$!
            trap 'kill "$identity_pid" 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5174 > /dev/null && curl -fsS http://127.0.0.1:8002/api/v1/health && break || sleep 2; done
            SAAS_E2E=1 E2E_BASE_URL=http://127.0.0.1:5174 npx playwright test e2e/accounts.spec.ts --grep "$scenario"
            kill "$identity_pid"
            wait "$identity_pid" || true
            trap - EXIT
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: |
            docs/screenshots/
            frontend/playwright-report/
