server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 9m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
  location = /health { return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 120s; proxy_set_header Host $host; }
  location /samples/ { proxy_pass http://backend:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
