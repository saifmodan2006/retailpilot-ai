services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: retailpilot
      POSTGRES_USER: retailpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailpilot -d retailpilot"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://retailpilot:${POSTGRES_PASSWORD}@db:5432/retailpilot
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      PUBLIC_DEMO: ${PUBLIC_DEMO:-false}
      DEMO_TTL_HOURS: ${DEMO_TTL_HOURS:-2}
      DEMO_MAX_TENANTS: ${DEMO_MAX_TENANTS:-4}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ERP_URL: http://erp:8001
      ERP_TOKEN: ${ERP_TOKEN:-local-simulator-only}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  erp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.mock_erp:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      ERP_TOKEN: ${ERP_TOKEN:-local-simulator-only}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
