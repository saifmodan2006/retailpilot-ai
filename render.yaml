# Free web service only. Supply a dedicated external demo PostgreSQL database.
# This blueprint deliberately creates no paid database, disk or private service.
services:
  - type: web
    name: retailpilot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.runtime.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 12 --timeout-keep-alive 5 --no-proxy-headers
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.15"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_DEMO
        value: "true"
      - key: DEMO_ENABLED
        value: "true"
      - key: DEMO_TTL_HOURS
        value: "2"
      - key: DEMO_MAX_TENANTS
        value: "4"
      - key: ERP_URL
        value: ""
      - key: LLM_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
