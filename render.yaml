# Free web service only. Supply a dedicated external demo PostgreSQL database.
# This blueprint deliberately creates no paid database, disk or private service.
services:
  - type: web
    name: retailpilot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.runtime.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 12 --timeout-keep-alive 5 --no-proxy-headers
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.15"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_DEMO
        value: "true"
      - key: DEMO_ENABLED
        value: "true"
      - key: DEMO_TTL_HOURS
        value: "2"
      - key: DEMO_MAX_TENANTS
        value: "4"
      - key: ERP_URL
        value: ""
      - key: LLM_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: ACCOUNTS_ENABLED
        value: "false"
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: REGISTRATION_MODE
        value: "restricted"
      - key: GOOGLE_AUTH_ENABLED
        value: "false"
      - key: EMAIL_SIGNUP_ENABLED
        value: "true"
      - key: EMAIL_DELIVERY_CONFIGURED
        value: "false"
      - key: CAPTCHA_ENABLED
        value: "false"
      - key: CAPTCHA_SITE_KEY
        sync: false
      - key: REAL_UPLOADS_ENABLED
        value: "false"
      - key: ACCOUNT_COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        value: "https://retailpilot-ai.pages.dev"
      - key: ACCOUNT_MAX_USERS
        value: "10"
      - key: ACCOUNT_MAX_ORGANIZATIONS
        value: "4"
